name: Flutter iOS Production Dağıtımı

on:
  push:
    tags:
      - "v*-[0-9]*" # Örn: v1.1.2-16 formatındaki tag'lerde tetiklenir

jobs:
  deploy-ios:
    name: iOS Build & App Store Dağıtımı
    runs-on: macos-latest

    steps:
      - name: Kodu GitHub'dan Çek
        uses: actions/checkout@v4

      - name: Stabil Xcode Sürümünü Ayarla
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0.1"

      - name: Xcode iOS Platform Bileşenlerini Hazırla
        run: |
          sudo env "DEVELOPER_DIR=${DEVELOPER_DIR:-$(xcode-select -p)}" \
            xcodebuild -runFirstLaunch -checkForNewerComponents
          xcodebuild -downloadPlatform iOS
          xcrun --sdk iphoneos --show-sdk-version

      # v1.1.2-16 tag'ini parçalayıp sürüm adını ve numarasını ayıran regex adım
      - name: Tag Bilgilerini Oku ve Değişken Yap
        id: get_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          # v1.1.2-16 -> Sürüm: 1.1.2, Build: 16
          BUILD_NAME=$(echo $TAG_NAME | sed -E 's/v(.*)-[0-9]+/\1/')
          BUILD_NUMBER=$(echo $TAG_NAME | sed -E 's/v.*-([0-9]+)/\1/')
          echo "VERSION_NAME=$BUILD_NAME" >> $GITHUB_ENV
          echo "VERSION_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV

      - name: SSH Key Kurulumu (Fastlane Match için)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GIT_PRIVATE_SSH_KEY }}

      - name: Sertifika Deposuna SSH Erişimini Doğrula
        env:
          GIT_TERMINAL_PROMPT: "0"
          GIT_SSH_COMMAND: "ssh -o BatchMode=yes"
        run: |
          if ! REMOTE_REFS="$(git ls-remote --symref git@github.com:mg-teamsoft/ios-certificates.git HEAD)"; then
            echo "::error::Sertifika deposuna SSH üzerinden erişilemedi. Anahtarın okuma yetkisini kontrol edin."
            exit 1
          fi
          MATCH_BRANCH="$(printf '%s\n' "$REMOTE_REFS" | awk '$1 == "ref:" && $3 == "HEAD" { sub(/^refs\/heads\//, "", $2); print $2; exit }')"
          if [ -z "$MATCH_BRANCH" ]; then
            echo "::error::Sertifika deposunun varsayılan branch'i bulunamadı. Depoda en az bir commit olmalı ve varsayılan branch ayarlanmalı."
            exit 1
          fi
          git check-ref-format --branch "$MATCH_BRANCH" > /dev/null
          printf 'MATCH_GIT_BRANCH=%s\n' "$MATCH_BRANCH" >> "$GITHUB_ENV"
          printf 'Match sertifika branch: %s\n' "$MATCH_BRANCH"

      - name: Flutter SDK Kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.1"
          channel: "stable"
          cache: true

      - name: Ruby ve Fastlane Bağımlılıklarını Kur
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Bağımlılıkları Yükle
        run: |
          flutter clean
          flutter pub get

      - name: CocoaPods Bağımlılıklarını Kur
        run: |
          cd ios
          bundle exec pod install --repo-update

      - name: Xcode Release Ayarlarını Doğrula
        run: |
          flutter --version
          xcodebuild -version
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -showBuildSettings -json > "$RUNNER_TEMP/ios-release-settings.json"
          python3 - "$RUNNER_TEMP/ios-release-settings.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as source:
              targets = json.load(source)
          if not any(target.get("target") == "Runner" and target.get("buildSettings") for target in targets):
              raise SystemExit("Runner Release build settings could not be read")
          PY

      # İmzalı arşiv ve IPA aşağıdaki Fastlane adımında oluşturulur.
      - name: Flutter iOS Release Yapılandırmasını Hazırla
        run: |
          flutter build ios --release --config-only \
            --no-codesign \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_NUMBER" \
            --dart-define=ENV=prod \
            --dart-define=API_BASE_URL=https://api.myfisapp.com

      - name: Fastlane ile İmzala ve App Store Connect'e Yükle
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }} # H32VC8PY7V
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} # a677955f-0f48-42e2-8929-2331441c61a5
          APP_STORE_CONNECT_BASE64_KEY: ${{ secrets.APP_STORE_CONNECT_BASE64_KEY }} # Secrets'a eklediğiniz p8 içeriği
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          cd ios
          bundle exec fastlane release
